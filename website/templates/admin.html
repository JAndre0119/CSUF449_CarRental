{% extends "base.html" %}
{% block content %}

<h1 class="section-title">Admin Dashboard</h1>
<p class="subtitle">Manage car listings and availability</p>

<div class="admin-table-container">
    <table class="admin-table">
        <thead>
            <tr>
                <th>Image</th>
                <th>Car</th>
                <th>Year</th>
                <th>Price/Day</th>
                <th>Quantity</th>
            </tr>
        </thead>

        <tbody>
            {% for car in cars %}
            <tr>
                <td>
                    <img src="{{ url_for('static', filename='images/' ~ (car.image_filename or 'placeholder.jpg')) }}"
                         class="admin-thumb">
                </td>
                <td>{{ car.make }} {{ car.model }}</td>
                <td>{{ car.year }}</td>
                <td>${{ '%.2f'|format(car.price_per_day) }}</td>
                <td>{{ car.total_quantity }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

{% endblock %}
