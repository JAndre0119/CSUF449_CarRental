{% extends "base.html" %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<div class="browse-container">
  <h2>Available Cars</h2>
  <div class="car-grid">
    {% for car in cars %}
    <div class="car-card">
      <img src="{{ url_for('static', filename='images/' + car.image_filename) }}" 
           alt="{{ car.name }}" class="car-img">
      <h3>{{ car.name }}</h3>
      <p>{{ car.make }} {{ car.model }} ({{ car.year }})</p>
      <p><strong>${{ "%.2f"|format(car.price_per_day) }}</strong> / day</p>
      <p class="availability">
        Available: {{ car.total_quantity }} / {{ car.total_quantity }}
      </p>
      <a href="{{ url_for('views.book', car_type=car.name) }}" class="book-btn">Book Now</a>
    </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
